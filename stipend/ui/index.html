<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스타이펜드 사업관리시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: 고정 좌측 업무 내비 + 상단 '지급월' 바. 각 화면은 요약(상단) → 상세(하단/우측) 순서. 금액·코드는 모노 서체로 장부처럼 정렬 */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F7F8FA; --line:#DCE2EB; --line-strong:#C3CDDA;
  --ink:#13203A; --ink-2:#3A4860; --muted:#67748A;
  --brand:#0B4DA2; --brand-ink:#FFFFFF; --brand-soft:#E5EDF9; --brand-strong:#083B7E;
  --nav:#FFFFFF; --nav-ink:#4E5B71; --nav-strong:#13203A; --nav-hover:#F3F5F8; --nav-line:#E6EAF0;
  --ok:#1C7A51; --ok-soft:#E2F2E9; --warn:#946000; --warn-soft:#FAEFD6; --bad:#B2362A; --bad-soft:#FAE4E1; --neutral-soft:#ECEFF4;
  --s1:#2F6CCB; --s2:#16917F; --s3:#7154C0; --s4:#C2841A; --s5:#BE4D78; --s6:#6A7891; --gapc:#B2362A;
  --scrim:rgba(10,20,40,.38);
  --shadow:0 1px 2px rgba(16,33,64,.05), 0 6px 20px rgba(16,33,64,.06);
  --shadow-lg:0 12px 40px rgba(10,24,50,.22);
  --f-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px; --r-sm:6px;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-sans);-webkit-font-smoothing:antialiased;letter-spacing:-.005em;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.02em}
a{color:var(--brand)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--nav);color:var(--nav-ink);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid var(--nav-line)}
.brand-t{color:var(--nav-strong);font-weight:700;font-size:15px;line-height:1.25}
.brand-s{font-size:11.5px;color:var(--nav-ink);opacity:.85}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:16px;flex:1;overflow:auto}
.nav-g{font-size:11px;letter-spacing:.08em;color:var(--nav-ink);opacity:.6;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--nav-ink);text-decoration:none;font-weight:500;font-size:13.5px;position:relative}
.nav a:hover{background:var(--nav-hover);color:var(--nav-strong)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav svg{width:17px;height:17px;flex:none;opacity:.9}
.nav .cnt{margin-left:auto;font:600 11px var(--f-mono);background:#D9483B;color:#fff;border-radius:9px;padding:0 6px;line-height:18px}
.side-foot{border-top:1px solid var(--nav-line);padding:14px 8px 0;font-size:12px;display:flex;gap:10px;align-items:center}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 28px;flex-wrap:wrap}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.crumb b{color:var(--ink);font-weight:600}
.top-r{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.month{display:flex;align-items:center;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;overflow:hidden}
.month button{border:0;background:none;padding:6px 9px;cursor:pointer;color:var(--muted)}
.month button:hover{color:var(--ink);background:var(--surface-2)}
.month button:disabled{opacity:.35;cursor:default;background:none}
.month span{padding:0 6px;font-weight:600;font-size:13px}
.month small{font-weight:500;color:var(--muted);font-size:11px;margin-right:4px}
.iconbtn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;width:34px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--brand);color:var(--brand)}
.iconbtn svg{width:16px;height:16px}

.view{padding:24px 28px 56px;display:flex;flex-direction:column;gap:20px;max-width:1480px;width:100%}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{font-size:23px;font-weight:700}
.head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.head .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- primitives ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{background:var(--brand-strong);border-color:var(--brand-strong);color:var(--brand-ink)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h3{font-size:14.5px;font-weight:700}
.panel-h .sub{font-size:12px;color:var(--muted)}
.panel-h .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-b{padding:16px 18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;line-height:18px}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.chip.plain::before{display:none}
.chip.ok{color:var(--ok);background:var(--ok-soft)}
.chip.warn{color:var(--warn);background:var(--warn-soft)}
.chip.bad{color:var(--bad);background:var(--bad-soft)}
.chip.info{color:var(--brand);background:var(--brand-soft)}
.chip.mute{color:var(--muted);background:var(--neutral-soft)}
.tag{font-size:11.5px;color:var(--ink-2);background:var(--neutral-soft);border-radius:4px;padding:1px 7px;white-space:nowrap}
.seg{display:inline-flex;background:var(--neutral-soft);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button .n{font-family:var(--f-mono);font-weight:500;margin-left:4px;opacity:.7}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:0 10px;height:34px;min-width:0}
.field input,.field select{border:0;background:none;outline:none;height:100%;min-width:0;width:100%}
.field svg{width:15px;height:15px;color:var(--muted);flex:none}
select.sel{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;height:34px;padding:0 10px}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.grid{display:grid;gap:20px}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-side{grid-template-columns:320px minmax(0,1fr)}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.02em;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.t tbody tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface-2)}
.t .r{text-align:right}
.t .c{text-align:center}
.t tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line-strong)}
.who{display:flex;flex-direction:column;line-height:1.3}
.who b{font-weight:600}
.who span{font-size:11.5px;color:var(--muted)}
.zero{color:var(--muted);opacity:.55}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.kpi .v{font:600 26px/1.15 var(--f-mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .v small{font:500 13px var(--f-sans);color:var(--muted);margin-left:3px;letter-spacing:0}
.kpi .d{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kpi .up{color:var(--ok);font-weight:600}
.kpi svg.spark{width:100%;height:34px;margin-top:2px}
.meter{height:6px;background:var(--neutral-soft);border-radius:4px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}

/* stepper (실제 업무 순서) */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:st}
.step{padding:14px 16px 14px 0;position:relative;display:flex;gap:0;align-items:flex-start}
.step .dot{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 11.5px var(--f-mono);flex:none;border:1.5px solid var(--line-strong);color:var(--muted);background:var(--surface)}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step.now .dot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:0 0 0 4px var(--brand-soft)}
.step::after{content:"";position:absolute;left:30px;right:8px;top:26px;height:1.5px;background:var(--line)}
.step:last-child::after{display:none}
.step.done::after{background:var(--ok)}
.step .tx{display:flex;flex-direction:column;line-height:1.35;padding:2px 10px 0;position:relative;z-index:1;background:var(--surface)}
.step .tx b{font-size:13px;font-weight:600}
.step .tx span{font-size:11.5px;color:var(--muted)}

/* todo list */
.todo{display:flex;flex-direction:column}
.todo a{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.todo a:last-child{border-bottom:0}
.todo a:hover{background:var(--surface-2)}
.todo .sev{width:4px;align-self:stretch;border-radius:3px;flex:none}
.todo .tt{display:flex;flex-direction:column;min-width:0;flex:1}
.todo .tt b{font-weight:600;font-size:13.5px}
.todo .tt span{font-size:12px;color:var(--muted)}
.todo .n{font:600 18px var(--f-mono)}
.todo svg{width:16px;height:16px;color:var(--muted);flex:none}

/* chart */
.chart text{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.chart .lbl{fill:var(--ink-2);font-weight:500}
.chart .grid line{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* 기준선 막대 (지원계획) */
.plan-side{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.plan-row{display:grid;grid-template-columns:200px minmax(0,1fr) 120px 100px 120px;gap:16px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.plan-row:hover{background:var(--surface-2)}
.plan-row.hd{cursor:default;background:var(--surface-2);font-size:11.5px;font-weight:600;color:var(--muted);padding-block:9px}
.plan-row.hd:hover{background:var(--surface-2)}
.plan-row .r{text-align:right}
.track{position:relative;height:22px;border-radius:4px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--line) calc(25% - 1px) 25%)}
.stack{position:absolute;inset:3px auto 3px 0;display:flex;border-radius:3px;overflow:hidden}
.stack i{height:100%;display:block;border-right:1px solid var(--surface)}
.stack i:last-child{border-right:0}
.gapz{position:absolute;top:3px;bottom:3px;border-radius:0 3px 3px 0;background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--gapc) 28%,transparent) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gapc) 55%,transparent)}
.thr{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.thr::after{content:attr(data-l);position:absolute;top:-14px;left:50%;transform:translateX(-50%);font:600 9.5px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.scale{position:relative;height:16px;font:500 10px var(--f-mono);color:var(--muted)}
.scale span{position:absolute;transform:translateX(-50%)}

/* 증빙 */
.q{display:flex;flex-direction:column;max-height:640px;overflow:auto}
.qi{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.qi:hover{background:var(--surface-2)}
.qi.on{background:var(--brand-soft)}
.qi .ic{width:34px;height:40px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font:600 9px var(--f-mono);color:var(--bad);flex:none;position:relative}
.qi .ic::after{content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;background:linear-gradient(225deg,var(--bg) 50%,var(--line-strong) 50%)}
.qi .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qi .tt b{font-weight:600;font-size:13px}
.qi .tt span{font-size:12px;color:var(--muted)}
.doc{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.doc .ln{height:8px;border-radius:3px;background:var(--line)}
.doc .mask{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 55%,transparent);backdrop-filter:blur(3px)}
.doc .mask div{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;font-size:12.5px;color:var(--ink-2);padding:12px}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px;font-size:13px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;min-width:0}
textarea.memo{width:100%;min-height:72px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:9px 11px;resize:vertical}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.tl li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--brand);margin-top:5px}
.tl li::after{content:"";position:absolute;left:5.5px;top:17px;bottom:0;width:1.5px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl b{font-weight:600;font-size:13px}
.tl span{display:block;font-size:12px;color:var(--muted)}

/* 연계 배치 */
.batches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.bt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bt-h{display:flex;align-items:flex-start;gap:10px}
.bt-h b{font-weight:700;font-size:14px;display:block}
.bt-h span{font-size:12px;color:var(--muted)}
.bt-h .chip{margin-left:auto}
.bt-m{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.bt-m div{display:flex;flex-direction:column}
.bt-m small{font-size:11px;color:var(--muted)}
.bt-m strong{font:600 14px var(--f-mono)}
.bt-f{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.bt-f .btn{margin-left:auto}
.qc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.qc div{padding:14px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.qc div:last-child{border-right:0}
.qc small{font-size:12px;color:var(--muted)}
.qc strong{font:600 22px var(--f-mono)}

/* 계정 */
.acct{display:flex;flex-direction:column}
.acct button{display:flex;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 16px;text-align:left;cursor:pointer}
.acct button:hover{background:var(--surface-2)}
.acct button.on{background:var(--brand-soft)}
.acct .nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.acct .nm b{font-weight:600;font-size:13px}
.acct .nm span{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.acct .bal{font:600 12.5px var(--f-mono)}
.ind1{padding-left:30px!important}
.ind2{padding-left:46px!important}
.ind1 .nm b,.ind2 .nm b{font-weight:500}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.sum3 div{padding:14px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.sum3 div:last-child{border-right:0}
.sum3 small{font-size:12px;color:var(--muted)}
.sum3 strong{font:600 20px var(--f-mono);letter-spacing:-.03em}
.in{color:var(--ok)}
.out{color:var(--bad)}

/* 지급내역 매트릭스 */
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:0}

/* settings */
.setrow{display:grid;grid-template-columns:150px 1fr 150px;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.money-in{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);height:36px;padding:0 10px;max-width:220px}
.money-in input{border:0;outline:none;background:none;width:100%;text-align:right;font:600 15px var(--f-mono)}
.money-in span{color:var(--muted);margin-left:6px;font-size:12.5px}
.mx td.c{font-size:15px}
.dotf{color:var(--brand)}
.doth{color:var(--s4)}
.doto{color:var(--muted)}

/* drawer / modal / toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow-lg);transform:translateX(104%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.show{transform:none}
.dr-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-b{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:22px}
.dr-b h4{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:10px}
.checks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px}
.checks div{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
.checks div:last-child{border-bottom:0}
.checks small{display:block;color:var(--muted);font-size:11.5px}
.ck{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.ck.ok{background:var(--ok-soft);color:var(--ok)}
.ck.warn{background:var(--warn-soft);color:var(--warn)}
.ck.bad{background:var(--bad-soft);color:var(--bad)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);opacity:0;pointer-events:none;z-index:42;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);width:min(460px,calc(100% - 32px));transition:all .2s}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal .mb{padding:22px}
.modal .mb h3{font-size:17px;margin-bottom:8px}
.modal .mb p{margin:0;color:var(--ink-2);font-size:13.5px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 12px 12px}
.toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:var(--bg);border-radius:9px;padding:10px 16px;font-size:13px;box-shadow:var(--shadow-lg);animation:tin .25s ease;max-width:min(420px,calc(100vw - 40px))}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* 사용자 전환 */
.whobtn{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;text-align:left;color:inherit;font-size:12px}
.whobtn:hover{background:var(--nav-hover)}
.who-t{flex:1;min-width:0;line-height:1.35}
.who-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whobtn>svg{margin-left:auto;width:14px;height:14px;opacity:.6;flex:none}
.rolemenu{position:fixed;left:14px;bottom:70px;width:268px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;z-index:50}
.rolemenu .h{font-size:11px;color:var(--muted);padding:6px 10px 4px;letter-spacing:.04em}
.rolemenu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left}
.rolemenu button:hover{background:var(--surface-2)}
.rolemenu button.on{background:var(--brand-soft)}
.rolemenu .who b{font-size:13px}
/* 신청 */
.wz{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wz button{flex:1;display:flex;gap:10px;align-items:center;padding:12px 16px;border:0;border-right:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.wz button:last-child{border-right:0}
.wz button:disabled{cursor:default}
.wz button.on{background:var(--brand-soft)}
.wz .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font:600 11.5px var(--f-mono);color:var(--muted);flex:none;background:var(--surface)}
.wz button.on .n{background:var(--brand);border-color:var(--brand);color:#fff}
.wz button.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.wz b{display:block;font-size:13px}
.wz span span{display:block;font-size:11.5px;color:var(--muted)}
.g-apply{grid-template-columns:minmax(0,1fr) 300px;align-items:start}
.sumcard{position:sticky;top:76px}
.final{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-strong);display:flex;flex-direction:column;gap:2px}
.final small{color:var(--muted);font-size:12px}
.final strong{font-size:26px;font-weight:600;letter-spacing:-.03em}
.final strong span{font:500 13px var(--f-sans);color:var(--muted);margin-left:3px}
input.cb{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;margin:0}
.sel.sm{height:30px;font-size:12.5px;padding:0 6px;border-radius:6px}
.amt-in{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:6px;height:30px;padding:0 8px;background:var(--surface)}
.amt-in:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.amt-in input{border:0;outline:none;background:none;width:92px;text-align:right;font:500 13px var(--f-mono)}
.amt-in input:disabled{color:var(--muted)}
.amt-in span{font-size:12px;color:var(--muted);margin-left:4px}
.t tr.dis td,.t tr.dis td b{color:var(--muted)}
.hint{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.hint svg{width:15px;height:15px;color:var(--brand);flex:none;margin-top:2px}
.formnav{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.acctline{display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);flex-wrap:wrap}
.acctline small{display:block;font-size:12px;color:var(--muted)}
.acctline b{font-size:14px}
.acctline strong{margin-left:auto;font-size:22px;font-weight:600}
.acctline strong span{font:500 13px var(--f-sans);color:var(--muted);margin-left:3px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:14px;border:1px solid var(--line-strong);border-radius:10px;cursor:pointer}
.opt input{margin-top:3px;accent-color:var(--brand)}
.opt b{display:block;font-size:13.5px}
.opt span span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.opt.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.droprow{display:flex;gap:8px;align-items:stretch}
.drop{flex:1;min-width:0;position:relative;border:1.5px dashed var(--line-strong);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop.has{border-style:solid;border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:var(--ok-soft)}
.drop>svg{width:20px;height:20px;color:var(--muted);flex:none}
.drop.has>svg{color:var(--ok)}
.drop .dt{flex:1;min-width:0;display:flex;flex-direction:column}
.drop .dt b{font-size:13.5px}
.drop .dt span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.agree{display:flex;flex-direction:column}
.agree label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--line)}
.agree label:last-child{border-bottom:0}
.agree input{margin-top:3px}
.done-box{text-align:center;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:8px}
.okmark{width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.okmark.warn{background:var(--warn-soft);color:var(--warn)}
.okmark svg{width:26px;height:26px}
.done-box h2{font-size:20px}
.done-box p{margin:0}
.tl li.pend::before{border-color:var(--line-strong)}
.alert{display:flex;gap:12px;align-items:center;padding:14px 18px;border-radius:10px;background:var(--warn-soft);color:var(--ink);text-decoration:none;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);flex-wrap:wrap}
.alert>svg{color:var(--warn);width:20px;height:20px;flex:none}
.alert .tx{flex:1;min-width:200px}
.alert .tx span{display:block;font-size:12.5px;color:var(--ink-2)}
.note{padding:10px 12px;border-radius:8px;font-size:12.5px;background:var(--warn-soft)}
.note b{color:var(--warn)}
.fi{width:36px;height:36px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.fi svg{width:18px;height:18px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}

/* 로그인 */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--bg)}
.login-l{padding:56px 64px 40px;display:flex;flex-direction:column;gap:40px;border-right:1px solid var(--line)}
.login-l .org{font-size:13px;color:var(--brand);font-weight:600;letter-spacing:.02em}
.login-l h1{font-size:34px;line-height:1.28;font-weight:700;margin-top:10px;letter-spacing:-.03em}
.login-l p{color:var(--muted);margin:14px 0 0;font-size:14.5px}
.sched h3{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;margin-bottom:10px}
.sched-l{display:flex;flex-direction:column;border-top:1px solid var(--line);max-width:520px}
.sched-l div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sched-l .d{font-family:var(--f-mono);color:var(--brand);font-weight:500;font-size:13px}
.sched-l span span{display:block;font-size:12px;color:var(--muted)}
.login-l footer{margin-top:auto;font-size:12px;color:var(--muted);display:flex;gap:6px 16px;flex-wrap:wrap}
.login-l footer b{color:var(--ink-2);font-weight:600}
.login-r{display:grid;place-items:center;padding:48px 24px}
.lcard{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
.lcard h2{font-size:24px}
.lcard .lsub{margin:4px 0 0;color:var(--muted);font-size:13px}
.lseg{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.lseg button{border:0;background:none;padding:12px 0;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.lseg button.on{color:var(--brand);border-color:var(--brand)}
.lf{display:flex;flex-direction:column;gap:6px}
.lf label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.lf input{height:46px;border:1px solid var(--line-strong);border-radius:8px;padding:0 14px;font-size:15px;background:var(--surface);outline:none}
.lf input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.lf.err input{border-color:var(--bad)}
.lf .em{font-size:12px;color:var(--bad)}
.lrow{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.lrow label{display:flex;gap:8px;align-items:center;cursor:pointer}
.lbtn{height:48px;font-size:15px;justify-content:center;width:100%}
.lor{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.lor::before,.lor::after{content:"";flex:1;height:1px;background:var(--line)}
.llinks{display:flex;justify-content:center;gap:16px;font-size:12.5px}
.llinks button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0}
.llinks button:hover{color:var(--ink);text-decoration:underline}
.lnote{font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:14px;margin:0}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* 세션 · 알림 · 사용자 메뉴 */
.sess{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.sess b{font:500 12.5px var(--f-mono);color:var(--ink)}
.sess b.low{color:var(--bad)}
.sess button{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;font-size:11.5px;padding:2px 8px;cursor:pointer;color:var(--ink-2)}
.sess button:hover{border-color:var(--brand);color:var(--brand)}
.iconbtn{position:relative}
.iconbtn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--surface)}
.pop{position:fixed;top:54px;right:28px;width:360px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);z-index:50;overflow:hidden}
.pop .ph{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px}
.pop .ph button{border:0;background:none;color:var(--brand);font-size:12px;cursor:pointer;font-weight:600}
.pop a{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.pop a:last-child{border-bottom:0}
.pop a:hover{background:var(--surface-2)}
.pop a i{width:7px;height:7px;border-radius:50%;background:var(--brand);margin-top:7px;flex:none}
.pop a.read i{background:transparent}
.pop a.read b{font-weight:400;color:var(--ink-2)}
.pop a b{display:block;font-size:13px;font-weight:600}
.pop a span{font-size:11.5px;color:var(--muted)}
.um-h{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.um-h b{display:block;font-size:13.5px}
.um-h span{font-size:11.5px;color:var(--muted)}
.um-meta{font-size:11.5px;color:var(--muted);padding:6px 10px 8px;line-height:1.6}
.rolemenu button.out{color:var(--bad)}

.t tr.need td{border-bottom:0}
.t tr.subrow td{background:var(--warn-soft);padding:12px 14px;white-space:normal}
.fix{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.fix-m{flex:1;min-width:240px;font-size:12.5px}
.fix-m b{color:var(--warn);margin-right:8px}
.fix-a{display:flex;gap:8px;align-items:center}
.pick{position:relative;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px dashed var(--line-strong);border-radius:6px;background:var(--surface);font-size:12.5px;cursor:pointer;max-width:260px}
.pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick:hover{border-color:var(--brand);color:var(--brand)}
.pick.has{border-style:solid;border-color:var(--ok);color:var(--ok)}
.pick svg{width:14px;height:14px;flex:none}
.pick input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .batches{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2-1,.plan-side,.g-apply{grid-template-columns:minmax(0,1fr)}
  .sumcard{position:static}
  .plan-row{grid-template-columns:150px minmax(0,1fr) 100px 80px 96px;gap:12px}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;z-index:30;padding:10px 16px;flex-direction:row;align-items:center;gap:12px;overflow:hidden}
  .brand{border:0;padding:0}
  .brand-s,.nav-g,.who-t,.whobtn>svg{display:none}
  .side-foot{border:0;padding:0;margin-left:auto}
  .rolemenu{left:auto;right:16px;top:58px;bottom:auto}
  .wz{flex-direction:column}
  .wz button{border-right:0;border-bottom:1px solid var(--line)}
  .opts,.pgrid{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;margin:0;overflow-x:auto;gap:4px;scrollbar-width:none}
  .nav a{white-space:nowrap;padding:7px 10px}
  .nav a.on::before{display:none}
  .nav a svg{display:none}
  .top{position:static;padding:10px 16px}
  .view{padding:18px 16px 48px}
  .g-side,.g-1-1{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:minmax(0,1fr)}
  .step::after{display:none}
  .step{padding:8px 0}
  .qc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qc div:nth-child(2){border-right:0}
  .qc div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .plan-row{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .plan-row .bar-c{grid-column:1/-1;order:3}
  .plan-row .c-th,.plan-row .c-tot{display:none}
  .plan-row.hd{display:none}
  .scale-row{display:none!important}
  .setrow{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .login{grid-template-columns:minmax(0,1fr)}
  .login-l{padding:28px 16px 24px;border-right:0;border-bottom:1px solid var(--line);gap:0}
  .login-l h1{font-size:24px}
  .sched,.login-l footer{display:none}
  .login-r{padding:28px 16px 40px;place-items:start center}
  .sess span{display:none}
  .pop{right:16px;top:100px}
}
@media (max-width:560px){
  .kpis,.batches{grid-template-columns:minmax(0,1fr)}
  .sum3{grid-template-columns:minmax(0,1fr)}
  .sum3 div{border-right:0;border-bottom:1px solid var(--line)}
  .head h1{font-size:20px}
  .brand-t{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<section class="login" id="login" hidden></section>
<div class="app" hidden>
  <aside class="side">
    <div class="brand">
      <div><div class="brand-t">스타이펜드 사업관리</div><div class="brand-s">이공계 연구생활장려금 · 연구지원팀</div></div>
    </div>
    <nav class="nav" id="nav" aria-label="주요 메뉴"></nav>
    <div class="side-foot">
      <button class="whobtn" id="whoBtn" aria-haspopup="menu" aria-label="사용자 메뉴">
        <span class="avatar" id="whoAv">박</span>
        <span class="who-t"><span id="whoName" style="display:block;color:var(--nav-strong);font-weight:600">박○○ 담당자</span><span id="whoSub" style="display:block;opacity:.75">연구지원팀 · 업무관리자</span></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>
      </button>
    </div>
    <div class="rolemenu" id="roleMenu" role="menu" hidden></div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="crumb" id="crumb"></div>
      <div class="top-r">
        <div class="month" role="group" aria-label="지급월 선택">
          <button id="mPrev" aria-label="이전 달">‹</button>
          <span><small>지급월</small><span class="num" id="mLabel">2026.10</span></span>
          <button id="mNext" aria-label="다음 달">›</button>
        </div>
        <div class="sess" title="30분 동안 사용하지 않으면 자동으로 로그아웃됩니다"><span>자동 로그아웃</span><b id="sessT">30:00</b><button id="sessExt">연장</button></div>
        <button class="iconbtn" id="bellBtn" aria-label="알림">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="dot" id="bellDot"></span>
        </button>
      </div>
      <div class="pop" id="bellPop" hidden></div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="학생연구자 상세"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* =========================================================
   데이터
   ========================================================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  const sem = course==='석사'?1+Math.floor(R()*4):course==='박사'?1+Math.floor(R()*8):1+Math.floor(R()*9);
  const yr = 2026 - Math.floor((sem-1)/2);
  const s = {id:'S'+String(i+1).padStart(3,'0'), join, name, course, sem, dept:dp.d, college:dp.c, advisor:dp.p, lab:dp.lab,
    sno: String(yr)+String(Math.floor(R()*9000+1000)).padStart(5,'2'),
    nri: String(Math.floor(R()*90000000+10000000)),
    status: course!=='석사' && sem>=7 && R()<0.5 ? '수료연구생' : '재학'};
  s.fulltime = (i%13===5)?'확인중':(i===17?'미충족':'충족');
  s.activity = R()<0.3?'학위논문':'연구과제';
  s.past = s.activity==='학위논문' ? '참여(2023.03~2025.02)' : '해당없음';
  s.limit = s.activity==='학위논문' ? (s.course==='석사'?'2027.02':'2028.08') : '-';
  // 최근 월 재원별 금액
  const th = state.base[courseBase(s)];
  const ratio = R()<0.6 ? 1+R()*0.75 : 0.3+R()*0.62;
  const total = r10k(th*ratio);
  const n = 1+Math.floor(R()*2.6);
  const keys=[]; while(keys.length<n){const k=pickSrc(); if(!keys.includes(k)) keys.push(k);}
  const w = keys.map(()=>0.3+R()); const ws=w.reduce((a,b)=>a+b,0);
  s.src={}; let acc=0;
  keys.forEach((k,j)=>{ const v = j===keys.length-1 ? total-acc : r10k(total*w[j]/ws); s.src[k]=v; acc+=v; });
  // 월별 이력
  s.hist={};
  keys.forEach(k=>{
    const start = R()<0.25 ? 2+Math.floor(R()*4) : 0;
    s.hist[k] = MONTHS.map((m,mi)=>{
      if(mi===LAST) return s.src[k];
      if(mi<start||mi<join) return 0;
      const r=R(); if(r<0.1) return 0;
      return r<0.72 ? s.src[k] : r10k(s.src[k]*(0.7+R()*0.5));

  });
  s.piBal = r10k(200000+R()*4800000); // 연구책임자계정 잔액
  return s;
});

    const e1=monthly[id].slice(0,4).reduce((a,b)=>a+b.sum,0), e2=monthly[id].slice(4).reduce((a,b)=>a+b.sum,0);

  const ftCheck = students.filter(s=>s.fulltime==='확인중').length;
  const mis = MISM.filter(m=>m.st!=='조치완료').length;
  const prev = CUR>0 ? gapHist[CUR-1] : gapSum;
  const delta = prev ? Math.round((gapSum-prev)/prev*100) : 0;

  const steps = [
    {t:'원천자료 연계', d:'10.02 산단회계 반영', s:'done'},
    {t:'지원요건 검토', d:`전일제 확인 ${ftCheck}명 남음`, s:'now'},

  if(CUR<LAST){ const mm=MONTHS[CUR].slice(5); ['02 산단회계 반영','08 요건 검토 완료','10 산정 완료','18 확정 · 김○○','20 지급계획 반영'].forEach((d,i)=>{ steps[i].s='done'; steps[i].d=mm+'.'+d; }); }

  // 월별 참여 인원 차트
  const W=640,H=230,pl=34,pr=10,pt=22,pb=28, iw=W-pl-pr, ih=H-pt-pb, ymax=40;
  const bw = iw/MONTHS.length*0.56;
  const y = v => pt+ih-(v/ymax)*ih;
  let bars='';
  cnt.forEach((c,i)=>{
    if(i>CUR) return;
    const a=actM(i); const m=a.filter(s=>courseBase(s)==='M').length;
    const x = pl + iw/MONTHS.length*(i+0.5) - bw/2;
    const isCur = i===CUR;
    bars += `<rect x="${x}" y="${y(c)}" width="${bw}" height="${y(m)-y(c)+0.5}" rx="2" fill="var(--s3)" opacity="${isCur?1:.55}"/>`;
    bars += `<rect x="${x}" y="${y(m)}" width="${bw}" height="${pt+ih-y(m)}" fill="var(--brand)" opacity="${isCur?1:.55}"/>`;
    bars += `<text x="${x+bw/2}" y="${y(c)-6}" text-anchor="middle" class="${isCur?'lbl':''}">${c}</text>`;
    bars += `<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" class="${isCur?'lbl':''}">${MONTHS[i].slice(5)}월</text>`;
  });
  let grid=''; [0,10,20,30,40].forEach(v=>{ grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/>`; });
  let ylab=''; [0,10,20,30,40].forEach(v=>{ ylab+=`<text x="${pl-8}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`; });

  const spark = (arr,col) => { const w=200,h=34,mx=Math.max(...arr)*1.1,mn=Math.min(...arr)*0.85;
    const pts = arr.map((v,i)=>[i*(w/(arr.length-1)), h-2-((v-mn)/(mx-mn))*(h-6)]);

    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d} L${w} ${h} L0 ${h}Z" fill="var(${col})" opacity=".1"/><path d="${d}" fill="none" stroke="var(${col})" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${last[0]-2}" cy="${last[1]}" r="2.6" fill="var(${col})"/></svg>`; };

  // 지도교수별
  const byLab = {}; el.forEach(s=>{ const k=s.advisor; byLab[k]=byLab[k]||{p:s.advisor,lab:s.lab,dept:s.dept,n:0,gap:0,tot:0}; byLab[k].n++; byLab[k].gap+=gapOf(s); byLab[k].tot+=totalOf(s)+gapOf(s); });
  const labs = Object.values(byLab).sort((a,b)=>b.n-a.n||b.gap-a.gap).slice(0,6);

    <div class="act"><button class="btn" data-export="자체점검 통계자료">${ico('dl')}자체점검 자료 추출</button></div>
  </div>

  <section class="panel" aria-label="명부 진행 단계">

    <div class="panel-b" style="padding-block:4px"><div class="steps">${steps.map((s,i)=>`<div class="step ${s.s}"><span class="dot">${s.s==='done'?'✓':i+1}</span><span class="tx"><b>${s.t}</b><span>${s.d}</span></span></div>`).join('')}</div></div>
  </section>

  <section class="kpis">
    <div class="kpi"><div class="l">참여 학생연구자 <span class="tiny num">${MN()}</span></div><div class="v">${el.length}<small>명</small></div>
      <div class="meter" title="석사 기준 ${nM}명 · 박사 기준 ${nD}명"><i style="width:${nM/el.length*100}%;background:var(--brand)"></i><i style="width:${nD/el.length*100}%;background:var(--s3)"></i></div>
      <div class="d"><span><i class="sw" style="background:var(--brand)"></i>석사 기준 ${nM}</span><span><i class="sw" style="background:var(--s3)"></i>박사 기준 ${nD}</span></div></div>
    <div class="kpi"><div class="l">기준금액 충족 비율 <span class="tiny">산단회계 지급만</span></div><div class="v">${Math.round(met/el.length*100)}<small>%</small></div>
      ${spark(metHist,'--ok')}<div class="d">${met}명 충족 · ${el.length-met}명 부족분 지원</div></div>
    <div class="kpi"><div class="l">부족분 지원 총액</div><div class="v">${man(gapSum)}<small>원</small></div>
      ${spark(gapHist,'--gapc')}<div class="d">전월 대비 <span class="${delta<=0?'up':''}" style="${delta>0?'color:var(--bad);font-weight:600':''}">${delta>0?'+':''}${delta}%</span></div></div>
    <div class="kpi"><div class="l">1인 평균 월 지급액 <span class="tiny">부족분 포함</span></div><div class="v">${man(avg)}<small>원</small></div>
      <div class="d" style="margin-top:auto">석사 기준 ${man(state.base.M)} · 박사 기준 ${man(state.base.D)}</div></div>
  </section>

  <div class="grid g-2-1">
    <section class="panel">
      <div class="panel-h"><h3>월별 참여 학생연구자</h3><span class="sub">단위: 명</span>
        <div class="r legend"><span><i style="background:var(--brand)"></i>석사 기준</span><span><i style="background:var(--s3)"></i>박사 기준</span></div></div>
      <div class="panel-b"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="3월부터 ${MN()}까지 월별 참여 학생연구자 수"><g class="grid">${grid}</g>${ylab}${bars}</svg></div>
    </section>

      <div class="panel-h"><h3>처리할 일</h3><span class="sub">2026.10.05 기준</span></div>

        <a href="#roster" data-filter="확인필요"><i class="sev" style="background:var(--warn)"></i><span class="tt"><b>전일제 여부 확인 필요</b><span>기준일 10.01 확인자료 미검토</span></span><span class="n">${ftCheck}</span>${ico('arrow')}</a>
        <a href="#sync"><i class="sev" style="background:var(--bad)"></i><span class="tt"><b>지급정보 불일치</b><span>지급계획·확정액·실지급액 비교</span></span><span class="n">${mis}</span>${ico('arrow')}</a>

  const srcTot = SRC.map(src=>el.reduce((a,s)=>a+(s.hist[src.k]?s.hist[src.k][CUR]:0),0));

    <div class="kpi"><div class="l">기준금액 충족</div><div class="v" style="color:var(--ok)">${el.length-short.length}<small>명</small></div><div class="d">산단회계 지급만으로 충족</div></div>
    <div class="kpi"><div class="l">부족</div><div class="v" style="color:var(--bad)">${short.length}<small>명</small></div><div class="d">평균 부족액 ${man(Math.round(gapSum/Math.max(short.length,1)))}원</div></div>
    <div class="kpi"><div class="l">부족분 지원 합계</div><div class="v">${won(gapSum)}<small>원</small></div><div class="d">기관 세부계정에서 지급</div></div>
  </section>
  <div class="grid">
    <section class="panel">
      <div class="panel-h">
        <div class="seg">${['전체','부족','충족'].map(k=>`<button class="${state.planFilter===k?'on':''}" data-pf="${k}">${k}</button>`).join('')}</div>
        <div class="r legend">${SRC.map(s=>`<span><i style="background:var(${s.col})"></i>${s.short}</span>`).join('')}<span><i style="background:repeating-linear-gradient(-45deg,var(--gapc) 0 2px,transparent 2px 4px);outline:1px solid var(--gapc)"></i>부족분</span></div>
      </div>
      <div class="plan-row hd"><span>학생연구자</span><span>재원별 지급예정액 · 기준선</span><span class="r c-tot">산단회계 합계</span><span class="r c-th">기준</span><span class="r">부족금액</span></div>
      <div class="plan-row hd scale-row" style="padding-block:4px 0;border-bottom:0"><span></span><div class="scale">${[0,600000,1200000,1800000,2400000].map(v=>`<span style="left:${pct(v)}%">${v?man(v):'0'}</span>`).join('')}</div><span class="c-tot"></span><span class="c-th"></span><span></span></div>

function validStep(n){
  const a=state.app;
  if(n>=2){ if(!appSel().length){ toast('신청할 학생을 한 명 이상 선택하세요.'); return false; }
    const z=appSel().find(s=>!(a.amt[s.id]>0)); if(z){ toast(`${z.name} 학생의 신청금액을 입력하세요.`); return false; } }
  if(n>=3){ if(!a.pi){ toast('연구책임자계정 잔액 처리 방법을 선택하세요.'); return false; }
    if(a.pi==='keep'&&!a.piReason.trim()){ toast('잔액을 사용할 수 없는 사유를 입력하세요.'); $('#piReason')?.focus(); return false; }

}
document.addEventListener('click',e=>{

  if(!e.target.closest('#roleMenu,#whoBtn')) toggleRoleMenu(false);

  if(t.id==='whoBtn') return toggleRoleMenu();
  if(t.dataset.role){ state.role=t.dataset.role; toggleRoleMenu(false); const h='#'+ROLES[state.role].home; if(location.hash===h) render(); else location.hash=h; window.scrollTo(0,0); return toast(`${ROLES[state.role].name}(으)로 전환했습니다.`); }
  if(t.dataset.next){ const n=+t.dataset.next; if(!validStep(n)) return; a.step=n; render(); return window.scrollTo(0,0); }
  if(t.dataset.prev){ a.step=+t.dataset.prev; render(); return window.scrollTo(0,0); }
  if(t.dataset.wz){ const n=+t.dataset.wz; if(n<=a.step){ a.step=n; render(true); } return; }

  if(t.dataset.ireq){ state.intake[t.dataset.ireq]='보완요청'; render(true); return toast(`${t.dataset.ireq} 교수에게 보완 요청을 보냈습니다.`); }
  if(t.dataset.resub){ const p=proofs.find(x=>x.id===t.dataset.resub), f=state.upl['p'+p.id];

});

function renderLogin(){
  const tab=LTABS.find(t=>t[0]===state.loginTab), er=state.loginErr, busy=state.loginBusy;
  $('#login').innerHTML = `
  <div class="login-l">
    <div><div class="org">부산대학교 산학협력단</div><h1>이공계 연구생활장려금<br>사업관리시스템</h1><p>지원 신청, 증빙 제출, 지급 내역 조회와 사업 운영 관리를 한곳에서 처리합니다.</p></div>
    <div class="sched"><h3>이번 달 일정</h3><div class="sched-l">
      <div><span class="d">10.01 – 10.20</span><span>11월분 지원 신청 접수<span>지도교수 · 학생별 부족분 신청</span></span></div>
      <div><span class="d">10.01</span><span>하반기 전일제 확인 기준일<span>건강보험 자격득실 확인서는 기준일 이후 발급본 제출</span></span></div>
      <div><span class="d">10.18</span><span>10월 참여 학생연구자 명부 확정</span></div>
      <div><span class="d">10.25</span><span>10월 연구생활장려금 지급</span></div>
    </div></div>
    <footer><span><b>연구지원팀</b> 051-510-7275 · 평일 09:00–18:00</span><span>개인정보처리방침</span><span>이용약관</span></footer>
  </div>
  <div class="login-r"><form class="lcard" id="loginForm" novalidate>
    <div><h2>로그인</h2><p class="lsub">학생·교수는 포털 아이디(학번·교번)와 비밀번호를 사용합니다.</p></div>
    <div class="lseg" role="tablist">${LTABS.map(t=>`<button type="button" role="tab" data-ltab="${t[0]}" class="${t[0]===state.loginTab?'on':''}" aria-selected="${t[0]===state.loginTab}">${t[1]}</button>`).join('')}</div>
    <div class="lf ${er.id?'err':''}"><label for="lid">${tab[2]}</label><input id="lid" autocomplete="username" placeholder="${tab[3]}" value="${state.loginId}" ${busy?'disabled':''}>${er.id?`<span class="em">${er.id}</span>`:''}</div>
    <div class="lf ${er.pw?'err':''}"><label for="lpw">비밀번호</label><input id="lpw" type="password" autocomplete="current-password" placeholder="포털 비밀번호" ${busy?'disabled':''}>${er.pw?`<span class="em">${er.pw}</span>`:''}</div>
    <div class="lrow"><label><input type="checkbox" class="cb" id="lsave">${tab[2]} 저장</label><span class="tiny muted">Caps Lock 확인</span></div>
    <button class="btn pri lbtn" type="submit" ${busy?'disabled':''}>${busy?'<span class="spin"></span>로그인 중':'로그인'}</button>
    <div class="lor">또는</div>
    <button class="btn lbtn" type="button" id="ssoBtn" ${busy?'disabled':''}>부산대학교 통합인증(SSO)으로 로그인</button>
    <div class="llinks"><button type="button" data-lhelp="id">아이디 찾기</button><button type="button" data-lhelp="pw">비밀번호 재설정</button><button type="button" data-lhelp="guide">이용 안내</button></div>
    <p class="lnote">공용 PC에서는 사용 후 꼭 로그아웃하세요.<br>30분 동안 사용하지 않으면 자동 로그아웃됩니다.</p>
  </form></div>`;
}
function doLogin(){
  state.loginBusy=true; renderLogin();
  setTimeout(()=>{ state.loginBusy=false; state.authed=true; state.role=state.loginTab; state.sessLeft=1800; state.loginErr={}; state.noteRead={};
    state.loginAt=new Date().toTimeString().slice(0,5);
    const h='#'+ROLES[state.role].home; if(location.hash===h) render(); else location.hash=h; window.scrollTo(0,0); tickSess(); },650);
}
function logout(msg){
  state.authed=false; state.loginId=''; toggleRoleMenu(false); $('#bellPop').hidden=true; closeLayers();
  history.replaceState(null,'',location.pathname); render(); if(msg) toast(msg);
}
document.addEventListener('submit',e=>{
  if(e.target.id!=='loginForm') return; e.preventDefault();
  const id=$('#lid').value.trim(), pw=$('#lpw').value; state.loginId=id; state.loginErr={};
  if(!id) state.loginErr.id=LTABS.find(t=>t[0]===state.loginTab)[2]+'를 입력하세요.';
  if(!pw) state.loginErr.pw='비밀번호를 입력하세요.';
  if(state.loginErr.id||state.loginErr.pw){ renderLogin(); (state.loginErr.id?$('#lid'):$('#lpw')).focus(); return; }
  doLogin();
});
const LHELP={id:'아이디는 학번·교번·교직원번호입니다. 확인이 어려우면 정보화본부로 문의하세요.',pw:'비밀번호는 부산대학교 포털 통합인증에서 재설정할 수 있습니다.',guide:'지도교수는 매월 1–20일에 다음 달 지원을 신청하고, 학생은 증빙을 제출합니다.'};
function fmtSess(){ const m=Math.floor(state.sessLeft/60), s=state.sessLeft%60; const el=$('#sessT'); if(el){ el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); el.classList.toggle('low',state.sessLeft<=300); } }
function tickSess(){ fmtSess(); }
setInterval(()=>{ if(!state.authed) return; state.sessLeft--; if(state.sessLeft===300) toast('5분 뒤 자동 로그아웃됩니다. 계속 사용하려면 연장을 누르세요.'); if(state.sessLeft<=0) return logout('30분 동안 사용하지 않아 자동 로그아웃되었습니다.'); fmtSess(); },1000);

function notes(){
  const ist=state.intake[PROF.p], h=hp(ME);
  return ({
    admin:[
      ...(state.app.status!=='작성중'?[{t:`${PROF.p} 교수 ${APPLY_L} 지원 신청 제출`,d:state.app.at,h:'#intake'}]:[]),
      ...proofs.filter(p=>p.log.some(l=>l.what==='재제출')).map(p=>({t:`${S(p.sid).name} ${p.type} 재제출`,d:'2026.10.05',h:'#evidence'})),
      {t:'산단회계 지급결과 연계 경고 3건',d:'2026.10.02 04:10',h:'#sync'},
      {t:'BK21 장학금 10월분 업로드 대기',d:'2026.10.03 09:00',h:'#sync'},
      {t:'이상철 교수 11월분 지원 신청 제출',d:'2026.10.02 10:14',h:'#intake'},
    ],
    prof:[
      ...(ist==='보완요청'?[{t:`${APPLY_L} 지원 신청 보완 요청`,d:'2026.10.05',h:'#p-apply'}]:ist==='접수완료'?[{t:`${APPLY_L} 지원 신청이 접수되었습니다`,d:'2026.10.05',h:'#p-apply'}]:[]),
      {t:`${ME.name} 학생 건강보험 자격득실 확인서 보완 요청`,d:'2026.10.04 14:05',h:'#p-students'},
      {t:`${APPLY_L} 지원 신청 마감 10.20 (D-15)`,d:'2026.10.05 09:00',h:'#p-apply'},
      {t:'10월 연구생활장려금 지급 예정일 10.25',d:'2026.10.01 09:00',h:'#p-history'},
    ],
    student:[
      ...(h.status==='보완요청'?[{t:'건강보험 자격득실 확인서 보완 요청',d:'2026.10.04 14:05',h:'#s-proof'}]:h.status==='승인'?[{t:'건강보험 자격득실 확인서 승인',d:'2026.10.05',h:'#s-proof'}]:[]),
      {t:'10월 연구생활장려금 지급 예정 (10.25)',d:'2026.10.01 09:00',h:'#s-home'},
      {t:'9월 연구생활장려금 지급 완료',d:'2026.09.25 15:00',h:'#s-home'},
    ],
  })[state.role].map(n=>({...n,id:state.role+'|'+n.t}));
}
function toggleBell(show){
  const m=$('#bellPop'); if(show===false){ m.hidden=true; return; }
  const ns=notes();
  m.innerHTML=`<div class="ph"><span>알림</span><button data-readall>모두 읽음</button></div>`+ns.map(n=>`<a href="${n.h}" data-note="${n.id}" class="${state.noteRead[n.id]?'read':''}"><i></i><span style="min-width:0"><b>${n.t}</b><span>${n.d}</span></span></a>`).join('');
  m.hidden=!m.hidden;
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#bellPop,#bellBtn')) toggleBell(false);
  const t=e.target.closest('button,a'); if(!t) return;
  if(t.dataset.ltab){ state.loginId=$('#lid').value; state.loginTab=t.dataset.ltab; state.loginErr={}; renderLogin(); $('#lid').focus(); return; }
  if(t.id==='ssoBtn'){ state.loginId=''; return doLogin(); }
  if(t.dataset.lhelp) return toast(LHELP[t.dataset.lhelp]);
  if(t.id==='sessExt'){ state.sessLeft=1800; fmtSess(); return toast('로그인 시간을 30분 연장했습니다.'); }
  if(t.id==='bellBtn') return toggleBell();
  if(t.hasAttribute('data-readall')){ notes().forEach(n=>state.noteRead[n.id]=1); toggleBell(false); return render(true); }
  if(t.dataset.note){ state.noteRead[t.dataset.note]=1; toggleBell(false); setTimeout(()=>render(true),0); return; }
  if(t.dataset.um==='out'){ toggleRoleMenu(false); return confirmModal('로그아웃할까요?','작성 중인 내용은 저장되지 않습니다.','로그아웃',()=>logout('로그아웃했습니다.')); }
  if(t.dataset.um==='pw'){ toggleRoleMenu(false); return toast('비밀번호는 부산대학교 포털 통합인증에서 변경할 수 있습니다.'); }
});
window.addEventListener('hashchange',()=>{ if(state.authed){ state.sessLeft=1800; fmtSess(); } toggleBell(false); });

/* =========================================================
   라우팅 · 이벤트
   ========================================================= */
const VIEWS = {intake:viewIntake, 'p-apply':viewApply, 'p-history':viewProfHistory, 'p-students':viewProfStudents, 's-home':viewStudentHome, 's-proof':viewStudentProof, dashboard:viewDashboard, roster:viewRoster, plan:viewPlan, evidence:viewEvidence, payments:viewPayments, accounts:viewAccounts, sync:viewSync, settings:viewSettings};
function route(){ const RL=ROLES[state.role]; const id=(location.hash||'').slice(1); return RL.routes.some(r=>r.id===id)?id:RL.home; }
function render(keepScroll){
  if(!state.authed){ document.querySelector('.app').hidden=true; $('#login').hidden=false; renderLogin(); return; }
  document.querySelector('.app').hidden=false; $('#login').hidden=true;
  const id = route(); renderNav(id); $('#bellDot').hidden = !notes().some(n=>!state.noteRead[n.id]);
  const y = window.scrollY;
  $('#view').innerHTML = VIEWS[id]();
  if(keepScroll) window.scrollTo(0,y);
}
window.addEventListener('hashchange',()=>{ closeLayers(); toggleRoleMenu(false); render(); window.scrollTo(0,0); });

function openLayer(sel){ $('#scrim').classList.add('show'); $(sel).classList.add('show'); $(sel).setAttribute('aria-hidden','false'); setTimeout(()=>$(sel).querySelector('button')?.focus(),50); }
function closeLayers(){ ['#drawer','#modal'].forEach(s=>{$(s).classList.remove('show');$(s).setAttribute('aria-hidden','true')}); $('#scrim').classList.remove('show'); }
$('#scrim').addEventListener('click',closeLayers);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLayers(); if(e.key==='Enter' && e.target.matches('[data-sid]')) openStudent(e.target.dataset.sid); });

function confirmModal(title,msg,ok,onOk){
  $('#modal').innerHTML = `<div class="mb"><h3>${title}</h3><p>${msg}</p></div><div class="mf"><button class="btn" data-close>취소</button><button class="btn pri" id="mOk">${ok}</button></div>`;
  openLayer('#modal');
  $('#mOk').onclick = ()=>{ closeLayers(); onOk(); };
}

document.addEventListener('click',e=>{
  const t = e.target.closest('button,a,tr,[data-sid]'); if(!t) return;
  if(t.matches('[data-close]')) return closeLayers();
  if(t.dataset.export) return toast(`${t.dataset.export} 파일(xlsx)을 생성했습니다. 추출 이력이 기록됩니다.`);
  if(t.dataset.filter){ state.rosterFilter=t.dataset.filter; }
  if(t.dataset.rf){ state.rosterFilter=t.dataset.rf; return render(true); }
  if(t.dataset.sid && !t.closest('#drawer')) return openStudent(t.dataset.sid);
  if(t.id==='unmask'){
    if(state.unmask){ state.unmask=false; render(true); return toast('개인정보 마스킹을 다시 적용했습니다.'); }
    return confirmModal('마스킹을 해제할까요?','학번과 국가연구자번호가 화면에 표시됩니다. 해제 사유("전일제 증빙 대조")와 시각이 접속 이력에 기록됩니다.','해제',()=>{state.unmask=true;render(true);toast('마스킹을 해제했습니다. 조회 이력이 기록되었습니다.')});
  }
  if(t.id==='confirmRoster'){
    const nCheck = students.filter(s=>s.fulltime==='확인중').length;
    return confirmModal(MN()+' 명부를 확정할까요?',`요건 충족 ${students.filter(s=>s.fulltime==='충족').length}명이 확정됩니다.<br>전일제 확인 중인 ${nCheck}명은 제외되며, 확인 후 추가 확정할 수 있습니다.<br>확정 이후 변경은 사유와 함께 이력으로 남습니다.`,'확정',()=>{
      state.rosterConfirmed=true; const d=new Date(); state.rosterConfirmedAt=`2026.10.05 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; render(true); toast(MN()+' 참여 학생연구자 명부를 확정했습니다.'); });
  }
  if(t.dataset.pf){ state.planFilter=t.dataset.pf; return render(true); }
  if(t.id==='recalc'){
    const d=new Date(); state.calcHist.push({at:`2026.10.05 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,by:'박○○',note:'수동 재산정',n:0});
    render(true); return toast(MN()+' 부족금액을 재산정했습니다. 변경된 학생은 없습니다.');
  }
  if(t.dataset.pt){ state.proofTab=t.dataset.pt; state.proofSel=null; return render(true); }
  if(t.dataset.pid){ state.proofSel=t.dataset.pid; return render(true); }
  if(t.id==='viewDoc'){ t.closest('.mask').remove(); return toast('증빙 열람 이력이 기록되었습니다.'); }
  if(t.dataset.act){
    const p=proofs.find(x=>x.id===state.proofSel); const memo=$('#memo').value.trim();
    if(t.dataset.act!=='승인' && !memo){ $('#memo').focus(); $('#memo').style.borderColor='var(--bad)'; return toast('보완 요청이나 반려는 처리 의견을 입력해야 합니다.'); }
    p.status=t.dataset.act; p.memo=memo; p.handler='박○○'; p.checked='2026.10.05';
    p.log.push({at:'2026.10.05 '+new Date().toTimeString().slice(0,5),who:'연구지원팀 박○○',what:t.dataset.act});
    if(p.type.includes('건강보험')){ const s=S(p.sid); if(t.dataset.act==='승인') s.fulltime='충족'; if(t.dataset.act==='반려') s.fulltime='미충족'; LEDGER=buildLedgers(); }
    state.proofSel=null; render(true);
    return toast(`${S(p.sid).name} · ${p.type}: ${t.dataset.act} 처리했습니다.`);
  }
  if(t.dataset.acct){ state.acctSel=t.dataset.acct; return render(true); }
  if(t.dataset.lf){ state.ledgerF=t.dataset.lf; return render(true); }
  if(t.dataset.rerun){ const b=BATCH[+t.dataset.rerun];
    if(b.mode==='파일 업로드') return toast(`${b.name} 표준 업로드 양식을 선택하세요. 업로드 후 검증 결과가 표시됩니다.`);
    b.err=0; b.st='정상'; b.last='10.05 '+new Date().toTimeString().slice(0,5); render(true); return toast(`${b.name} 재처리를 완료했습니다.`); }
  if(t.id==='runAll'){ BATCH.forEach(b=>{ if(b.mode==='DB 연계'){ b.err=0; b.st='정상'; b.last='10.05 '+new Date().toTimeString().slice(0,5);} }); render(true); return toast('DB 연계 4건을 재처리했습니다. 업로드 재원 2건은 파일이 필요합니다.'); }
  if(t.dataset.fix){ const m=MISM[+t.dataset.fix]; m.st = m.st==='미조치'?'조치중':'조치완료'; render(true); return toast(m.st==='조치중'?'조치 내용을 등록했습니다.':'불일치 건을 조치 완료로 닫았습니다.'); }
  if(t.dataset.st){ state.setTab=t.dataset.st; return render(true); }
  if(t.id==='saveBase'){
    const m=+$('#bM').value.replace(/[^\d]/g,''), d=+$('#bD').value.replace(/[^\d]/g,'');
    if(!m||!d||m>d) return toast('기준금액을 확인하세요. 석사 금액은 박사 금액보다 클 수 없습니다.');
    if(m===state.base.M && d===state.base.D) return toast('변경된 값이 없습니다.');
    state.base={M:m,D:d}; state.baseHist.push({at:'2026.10.05',m,d,by:'박○○',note:`${$('#bFrom').value}부터 적용 · 부족금액 재산정 필요`});
    LEDGER=buildLedgers(); render(true); return toast('기준금액을 저장했습니다. 지원계획 화면의 부족금액이 새 기준으로 다시 계산됩니다.');
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='rq'){ state.rosterQ=e.target.value; const pos=e.target.selectionStart; render(true); const i=$('#rq'); i.focus(); i.setSelectionRange(pos,pos); }
  if(e.target.id==='bM'||e.target.id==='bD'){ const v=e.target.value.replace(/[^\d]/g,''); e.target.value = v?won(+v):''; }
});
document.addEventListener('change',e=>{ if(e.target.id==='paySel'){ state.paySid=e.target.value; render(true); } });

// 지급월
function setMonth(i){ CUR=Math.max(0,Math.min(LAST,i)); $('#mLabel').textContent=MONTHS[CUR]; $('#mPrev').disabled=CUR===0; $('#mNext').disabled=CUR===LAST; render(true); }
$('#mPrev').onclick=()=>setMonth(CUR-1);
$('#mNext').onclick=()=>setMonth(CUR+1);
$('#mNext').disabled=true;


render();
</script>
