<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그린케어 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --g:#0E9F6E; --g2:#0B7F58; --g-soft:#E7F6EF; --g-line:#BFE6D3;
  --ink:#111827; --ink2:#4B5563; --ink3:#9CA3AF; --line:#E5E7EB; --card:#fff;
  --warn:#F59E0B; --warn-soft:#FEF3C7; --red:#E5484D; --red-soft:#FDECEC; --blue:#2F6BFF; --blue-soft:#EAF0FF;
  --navy:#0F2A3D; --wk:#0C2A20;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;background:linear-gradient(135deg,#E3F3EA,#EDF1F7);overflow:hidden}
body.bg-white{background:#fff}body.bg-dark{background:#15181C}body.bg-green{background:#0E3B2C}body.bg-gray{background:#E9EDF1}
button{font:inherit}

/* ---------- page chrome ---------- */
.top{position:fixed;top:0;left:0;right:0;height:52px;z-index:50;display:flex;gap:16px;align-items:center;padding:0 20px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid #dde2e7;font-size:13px}
.top b{font-size:15px}
.grp{display:flex;gap:4px;align-items:center}
.grp>span{color:#6b7280;margin-right:4px}
.top button,.side button{border:1px solid #d6dbe1;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;color:#374151;font-size:13px}
.top button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.top .hint{margin-left:auto;color:#6b7280}
.stage{position:fixed;top:52px;left:0;right:280px;bottom:0;display:flex;align-items:center;justify-content:center}
.side{position:fixed;top:52px;right:0;bottom:0;width:280px;background:rgba(255,255,255,.85);border-left:1px solid #dde2e7;overflow:auto;padding:16px;font-size:13px}
.side h4{font-size:12px;color:#6b7280;margin:16px 0 6px;font-weight:600}
.side h4:first-child{margin-top:0}
.side .jl{display:flex;flex-direction:column;gap:2px}
.side .jl button{border:0;text-align:left;background:transparent;padding:7px 10px;border-radius:8px}
.side .jl button:hover{background:#eef1f4}
.side .jl button.on{background:var(--g-soft);color:var(--g2);font-weight:600}
.side .demo{display:flex;flex-direction:column;gap:6px}
.side .note{color:#6b7280;line-height:1.5;font-size:12px;margin-top:6px}
body.capture .top,body.capture .side{display:none}
body.capture .stage{top:0;right:0}

/* ---------- iPhone ---------- */
.phone{position:relative;width:417px;height:876px;border-radius:66px;padding:12px;background:#1b1c1f;box-shadow:inset 0 0 0 2px #3a3b3f,inset 0 0 0 5px #0a0a0b,0 30px 60px -20px rgba(15,23,42,.35),0 12px 24px -12px rgba(15,23,42,.25);zoom:var(--pz,1);flex:none}
.phone::before{content:"";position:absolute;left:-3px;top:180px;width:3px;height:64px;border-radius:2px 0 0 2px;background:#2a2b2f;box-shadow:0 84px 0 #2a2b2f,0 -60px 0 0 #2a2b2f}
.phone::after{content:"";position:absolute;right:-3px;top:250px;width:3px;height:100px;border-radius:0 2px 2px 0;background:#2a2b2f}
.screen{position:relative;width:393px;height:852px;border-radius:54px;overflow:hidden;background:var(--bg,#F4F6F7);display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:20px;z-index:90}
.status{flex:none;height:54px;padding:19px 30px 0 44px;display:flex;justify-content:space-between;align-items:flex-start;font-weight:600;font-size:16.5px;z-index:5}
.status .r{display:flex;gap:6px;align-items:center;padding-top:2px}
.status.lt{color:#fff}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:#111;z-index:95}
.homebar.lt{background:#fff}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:16px}
.body::-webkit-scrollbar{display:none}
.anim-push{animation:pushIn .3s cubic-bezier(.2,.8,.2,1)}
.anim-pop{animation:popIn .26s cubic-bezier(.2,.8,.2,1)}
.anim-fade{animation:fade .2s}
@keyframes pushIn{from{transform:translateX(46px);opacity:0}}
@keyframes popIn{from{transform:translateX(-36px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
[data-a]{cursor:pointer;-webkit-user-select:none;user-select:none}
.btn[data-a]:active,.bigbtn[data-a]:active,.card[data-a]:active,.job[data-a]:active{transform:scale(.985)}

/* ---------- common UI ---------- */
.nav-h{flex:none;display:flex;align-items:center;gap:8px;padding:6px 18px 12px;font-size:18px;font-weight:700;letter-spacing:-.02em;min-height:44px}
.nav-h .back{width:26px;height:26px;margin-left:-4px}
.nav-h .sp{flex:1}
.pad{padding:0 20px}
.card{background:var(--card);border-radius:20px;padding:18px;margin:0 16px 12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.t12{font-size:12px}.t13{font-size:13px}.t14{font-size:14px}.t15{font-size:15px}.t16{font-size:16px}.t18{font-size:18px}.t20{font-size:20px}.t22{font-size:22px}.t26{font-size:26px}
.b{font-weight:700}.sb{font-weight:600}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--g-soft);color:var(--g2);white-space:nowrap}
.chip.gray{background:#F1F3F5;color:var(--ink2)}
.chip.warn{background:var(--warn-soft);color:#B45309}
.chip.red{background:var(--red-soft);color:#C2292E}
.chip.blue{background:var(--blue-soft);color:#2350C8}
.chip.navy{background:#E6EDF3;color:var(--navy)}
.chip.dark{background:var(--ink);color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:600;background:#fff;border:1.5px solid var(--line);color:var(--ink2)}
.pill.on{background:var(--g);border-color:var(--g);color:#fff}
.pill.x{color:#C6CBD1;text-decoration:line-through;background:#FAFAFB}
.btn{display:flex;align-items:center;justify-content:center;height:56px;border-radius:16px;font-size:17px;font-weight:700;background:var(--g);color:#fff;letter-spacing:-.01em;transition:transform .08s}
.btn.ghost{background:#F1F3F5;color:var(--ink)}
.btn.white{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.dis{background:#E5E7EB;color:#9CA3AF;pointer-events:none}
.btn.sm{height:44px;font-size:15px;border-radius:12px}
.btn.navy{background:var(--navy)}
.btn.red{background:var(--red)}
.cta{flex:none;padding:12px 16px 34px;display:flex;gap:8px}
.cta .btn,.cta .bigbtn{flex:1}
.hr{height:1px;background:var(--line);margin:14px 0}
.sec-t{font-size:17px;font-weight:700;letter-spacing:-.02em;padding:14px 20px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec-t a{font-size:13px;color:var(--ink3);font-weight:500}
.ic{width:20px;height:20px;flex:none}
.tabbar{flex:none;height:86px;padding:8px 10px 0;background:#fff;border-top:1px solid #EEF0F2;display:flex;justify-content:space-around}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:#A0A6AE;width:64px;position:relative}
.tabbar div.on{color:var(--ink)}
.tabbar svg{width:24px;height:24px}
.tabbar .badge{position:absolute;top:-3px;right:12px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.notice{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--ink2);background:#F1F3F5;border-radius:14px;padding:12px 14px}
.notice.g{background:var(--g-soft);color:#14593F}
.notice.w{background:var(--warn-soft);color:#8A4B06}
.notice.r{background:var(--red-soft);color:#9B1C20}
.notice .ic{width:18px;height:18px;margin-top:1px}
.field{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid #F1F3F5;font-size:14px;gap:8px}
.field:last-child{border-bottom:0}
.field .k{width:78px;color:var(--ink3);flex:none;font-size:13px}
.field .v{flex:1;font-weight:600}
.ok{width:18px;height:18px;border-radius:50%;background:var(--g);display:grid;place-items:center;flex:none}
.ok svg{width:11px;height:11px}
.ok.w{background:var(--warn)}
.ok.off{background:#D9DDE1}
.input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:16px;outline:none;background:#fff;color:var(--ink)}
.input:focus{border-color:var(--g)}
textarea.input{resize:none;height:96px;line-height:1.5}
.lbl{font-size:14px;font-weight:700;margin:18px 0 8px}
.switch{width:50px;height:30px;border-radius:15px;background:#D9DDE1;position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.switch.on{background:var(--g)}.switch.on::after{left:23px}
.menu-row{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #F1F3F5;font-size:16px;font-weight:600}
.menu-row:last-child{border:0}
.menu-row .ic{color:var(--ink3)}
.empty{text-align:center;color:var(--ink3);font-size:14px;padding:40px 0}
.link{color:var(--blue);font-weight:600}

/* overlays */
.overlay{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;animation:fade .18s}
.sheet{width:100%;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px 38px;animation:up .28s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D9DDE1;margin:0 auto 16px}
.sheet h3{font-size:20px;letter-spacing:-.02em;margin-bottom:6px}
.opt{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:16px;border:1.5px solid var(--line);margin-top:8px;font-size:16px;font-weight:600}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid #C9CED4;flex:none}
.opt.on{border-color:var(--g);background:var(--g-soft)}
.opt.on .rd{border:7px solid var(--g)}
.opt small{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-top:2px}
.toast{position:absolute;left:50%;bottom:116px;transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:99;white-space:nowrap;animation:fade .2s}
.loading{position:absolute;inset:0;z-index:85;background:rgba(255,255,255,.75);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;font-weight:600;color:var(--ink2);animation:fade .15s}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--g-soft);border-top-color:var(--g);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.typing{display:inline-flex;gap:4px;padding:14px 16px;background:#fff;border-radius:18px}
.typing i{width:7px;height:7px;border-radius:50%;background:#B8BFC6;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.3;transform:translateY(-3px)}}

/* photos */
.ph{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1/1;background:linear-gradient(160deg,#cfd6dd,#9aa5b1)}
.ph svg.car{position:absolute;left:8%;bottom:14%;width:84%;height:auto;aspect-ratio:200/80}
.ph.before::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 70%,rgba(110,80,40,.45) 0 10%,transparent 11%),radial-gradient(circle at 62% 64%,rgba(110,80,40,.4) 0 7%,transparent 8%),radial-gradient(circle at 75% 76%,rgba(110,80,40,.35) 0 6%,transparent 7%),linear-gradient(0deg,rgba(120,90,50,.25),transparent 60%)}
.ph.after{background:linear-gradient(160deg,#dbe7f0,#a9bccb)}
.ph.after::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 45%,transparent 55%)}
.ph .tag{position:absolute;left:6px;top:6px;z-index:2;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(17,24,39,.72);color:#fff}
.ph .tag.a{background:var(--g)}
.ph .meta{position:absolute;left:0;right:0;bottom:0;z-index:2;font-size:9px;color:#fff;padding:10px 6px 4px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.ph .meta.late{background:linear-gradient(transparent,rgba(180,83,9,.9))}
.slot{border-radius:12px;aspect-ratio:1/1;border:2px dashed #C9CED4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8A919A;font-size:12px;font-weight:600;background:#fff}
.slot.next{border-color:var(--g);color:var(--g2);background:var(--g-soft)}
.slot.lock{opacity:.45}
.slot svg{width:26px;height:26px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

/* camera */
.cam{position:absolute;inset:0;z-index:88;background:#000;display:flex;flex-direction:column;color:#fff;animation:fade .2s}
.cam .vf{flex:1;margin:60px 0 0;position:relative;background:linear-gradient(170deg,#59636e,#2b3138);overflow:hidden}
.cam .vf svg.car{position:absolute;left:10%;bottom:22%;width:80%}
.cam .vf .grid3{position:absolute;inset:0;background:linear-gradient(90deg,transparent 33%,rgba(255,255,255,.18) 33.3%,transparent 33.6%,transparent 66.4%,rgba(255,255,255,.18) 66.6%,transparent 67%),linear-gradient(0deg,transparent 33%,rgba(255,255,255,.18) 33.3%,transparent 33.6%,transparent 66.4%,rgba(255,255,255,.18) 66.6%,transparent 67%)}
.cam .guide{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:8px 14px;border-radius:12px;font-size:14px;font-weight:700;white-space:nowrap}
.cam .metaL{position:absolute;bottom:12px;left:12px;font-size:11px;opacity:.85;line-height:1.5}
.cam .ctl{height:190px;display:flex;align-items:center;justify-content:space-around;padding-bottom:30px}
.cam .shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;display:grid;place-items:center}
.cam .shutter i{width:60px;height:60px;border-radius:50%;background:#fff}
.cam .flash{position:absolute;inset:0;background:#fff;animation:flash .35s forwards;pointer-events:none}
@keyframes flash{to{opacity:0}}
.cam .thumbs{width:56px;height:56px;border-radius:12px;background:#333;overflow:hidden}

/* consumer */
.c-top{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 14px}
.logo{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:800;letter-spacing:-.04em;color:var(--g2)}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--g);display:grid;place-items:center}
.sub-card{margin:0 16px 12px;border-radius:24px;padding:20px;background:linear-gradient(140deg,#0E9F6E,#0A7A6B);color:#fff;position:relative;overflow:hidden}
.sub-card::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.sub-card .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.25);margin-top:14px;overflow:hidden}
.sub-card .bar i{display:block;height:100%;background:#fff;border-radius:3px}
.ai-box{margin:0 16px 12px;border-radius:20px;padding:16px;background:#fff;border:1.5px solid var(--g-line)}
.ai-input{margin-top:10px;display:flex;align-items:center;gap:8px;background:#F4F7F6;border-radius:14px;padding:12px 12px 12px 14px;font-size:14px;color:#8A919A}
.ai-input .send,.send{margin-left:auto;width:34px;height:34px;border-radius:10px;background:var(--g);display:grid;place-items:center;flex:none}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 16px 12px}
.quick div{background:#fff;border-radius:18px;padding:14px 0 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink)}
.quick i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--g-soft)}
.quick i svg{width:22px;height:22px}
.bubble{max-width:82%;padding:12px 15px;border-radius:20px;font-size:15px;line-height:1.5}
.bubble.me{margin-left:auto;background:var(--g);color:#fff;border-bottom-right-radius:6px}
.composer{flex:none;display:flex;gap:8px;align-items:flex-end;padding:10px 14px 34px;background:#fff;border-top:1px solid #EEF0F2}
.composer textarea{flex:1;border:0;background:#F4F6F7;border-radius:18px;padding:12px 14px;font:inherit;font-size:15px;resize:none;height:46px;outline:none;line-height:1.4}
.steps{flex:none;display:flex;gap:6px;padding:0 20px 16px}
.steps div{flex:1;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink3)}
.steps div::before{content:"";display:block;height:4px;border-radius:2px;background:#E1E5E9;margin-bottom:6px}
.steps div.done::before,.steps div.on::before{background:var(--g)}
.steps div.on{color:var(--g2)}
.seg{display:flex;background:#EEF0F2;border-radius:12px;padding:4px}
.seg div{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg div.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days div{height:44px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:600;background:#F4F6F7}
.days div.on{background:var(--g);color:#fff}
.days div.x{color:#C6CBD1;text-decoration:line-through;pointer-events:none}
.dates{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.dates::-webkit-scrollbar{display:none}
.dates div{flex:none;width:54px;height:68px;border-radius:14px;background:#F4F6F7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink2);font-weight:600}
.dates div b{font-size:18px;color:var(--ink)}
.dates div.on{background:var(--g);color:#fff}.dates div.on b{color:#fff}
.dates div.x{opacity:.35;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.slots div{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:600}
.slots div small{display:block;font-size:12px;font-weight:500;color:var(--ink3);margin-top:2px}
.slots div.on{border-color:var(--g);background:var(--g-soft);color:var(--g2)}
.slots div.on small{color:var(--g)}
.slots div.x{color:#C6CBD1;background:#FAFAFB;pointer-events:none}
.slots div.x small{color:#D0D4D9}
.plan{border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;background:#fff}
.plan.on{border-color:var(--g);background:var(--g-soft)}
.plan ul{list-style:none;margin-top:8px;font-size:13px;color:var(--ink2);line-height:1.7}
.plan ul li::before{content:"✓ ";color:var(--g)}
.carsel{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;background:#fff}
.carsel.on{border-color:var(--g);background:var(--g-soft)}
.carsel .ci{width:44px;height:44px;border-radius:12px;background:#F1F3F5;display:grid;place-items:center}
.sched{display:flex;align-items:center;gap:12px;padding:10px 0}
.sched .n{width:34px;height:30px;border-radius:10px;background:var(--g-soft);color:var(--g2);font-size:12px;font-weight:700;display:grid;place-items:center}
.tl{position:relative;padding-left:34px}
.tl .it{position:relative;padding-bottom:20px}
.tl .it::before{content:"";position:absolute;left:-23px;top:22px;bottom:-2px;width:2px;background:var(--g)}

.otp span:nth-child(-n+3){border-color:var(--ink)}

/* logout */
.logout-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;margin:4px 16px 8px;border-radius:16px;background:#fff;font-size:15.5px;font-weight:600;color:var(--ink2)}
.logout-btn:active{background:#F1F3F5}
.app-ver{text-align:center;font-size:12px;color:var(--ink3);padding:4px 0 20px}
.ios-ov{position:absolute;inset:0;z-index:86;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;animation:fade .15s}
.ios-alert{width:290px;background:rgba(250,250,252,.98);border-radius:18px;overflow:hidden;text-align:center;animation:pop .18s cubic-bezier(.2,.8,.2,1)}
.ios-alert .ia-b{padding:22px 18px 18px}
.ios-alert h4{font-size:17px;font-weight:700;letter-spacing:-.02em}
.ios-alert p{font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
.ios-alert .ia-btns{display:flex;border-top:1px solid #DDE0E4}
.ios-alert .ia-btns div{flex:1;height:48px;display:grid;place-items:center;font-size:16.5px;font-weight:500;color:var(--ink)}
.ios-alert .ia-btns div+div{border-left:1px solid #DDE0E4}
.ios-alert .ia-btns .danger{color:var(--red);font-weight:700}
@keyframes pop{from{transform:scale(1.08);opacity:0}}
.acct{display:flex;align-items:center;gap:12px;padding:4px 0 16px;border-bottom:1px solid #F1F3F5;margin-bottom:6px}
.sheet .logout-btn{margin:16px 0 0;background:#F6F7F9;color:#C2292E}
.a-menu{position:absolute;top:54px;right:20px;z-index:70;width:270px;background:#fff;border:1px solid #E6E9ED;border-radius:14px;box-shadow:0 18px 40px -14px rgba(15,23,42,.28);padding:8px;animation:fade .12s}
.a-menu .am-h{padding:12px 12px 12px;border-bottom:1px solid #F1F3F5;margin-bottom:6px}
.a-menu .am-i{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.a-menu .am-i:hover{background:#F5F6F8}
.a-menu .am-i.danger{color:#C2292E}
.a-menu .am-sep{height:1px;background:#F1F3F5;margin:6px 4px}
.a-org{display:flex;align-items:center;gap:8px}
.a-org .lo{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink3);cursor:pointer}
.a-org .lo:hover{background:#F3F5F7;color:#C2292E}
</style>
</head>

function aiParse(t){
  const r={svc:/실내|안쪽|내부/.test(t)?'외부+실내':/프리미엄|디테일/.test(t)?'프리미엄 디테일':'외부',
    car:/쏘렌토|대형|SUV/i.test(t)?2:1, addrK:/회사|사무실|직장/.test(t)?'office':'home',
    ampm:/오후/.test(t)?'pm':'am'};
  const m=t.match(/(월|화|수|목|금|토|일)요일/);let d=addD(TODAY,3);
  if(m){const tg=DOW.indexOf(m[1]);d=addD(TODAY,1);while(d.getDay()!==tg)d=addD(d,1)}
  else if(/내일/.test(t))d=addD(TODAY,1); else if(/모레/.test(t))d=addD(TODAY,2);
  if(d.getDay()===0)d=addD(d,1);
  r.date=d; r.price=ONCE[r.svc]+(car(r.car).size==='대형'?10000:0);
  r.blocked=r.ampm==='am'?'08:00–10:00':'12:00–14:00';
  r.alts=r.ampm==='am'?['10:00–12:00','14:00–16:00']:['14:00–16:00','16:00–18:00'];
  return r;
}

/* 신청 플로우 (정기/출장) */
function flowSteps(f){return f.mode==='sub'?['상품','차량','일정','장소','확인']:['서비스','차량','일정','장소','확인']}
function stepBar(f){return `<div class="steps">${flowSteps(f).map((s,i)=>`<div class="${i<f.step?'done':i===f.step?'on':''}">${s}</div>`).join('')}</div>`}
function fullSlot(date,slot){if(!date)return false;const h=(date.getDate()*7+SLOTS.indexOf(slot)*3)%5;return h===0}
function schedule(f){
  let d=addD(TODAY,3);while(d.getDay()!==f.day)d=addD(d,1);
  const gap=f.cycle==='매주'?7:f.cycle==='격주'?14:28;
  return [0,1,2,3].map(i=>addD(d,gap*i));
}

};
